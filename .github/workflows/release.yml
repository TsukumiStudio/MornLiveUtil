name: Release mac app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check release secrets
        env:
          MORN_NOTARY_TOKEN: ${{ secrets.MORN_NOTARY_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          for name in MORN_NOTARY_TOKEN HOMEBREW_TAP_TOKEN; do
            if [ -z "${!name:-}" ]; then echo "::error::${name} が未登録"; exit 1; fi
          done

      - name: Build
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}" sh make-app.sh
          .build/release/MornLiveUtil --selftest

      - name: Sign & notarize via MornNotary
        env:
          # classic PAT (repo), matsufriends/MornNotary に書き込めるもの
          GH_TOKEN: ${{ secrets.MORN_NOTARY_TOKEN }}
        run: |
          set -euo pipefail
          gh auth setup-git
          gh repo clone matsufriends/MornNotary "$RUNNER_TEMP/MornNotary" -- --depth 1
          bash "$RUNNER_TEMP/MornNotary/sign.sh" MornLiveUtil.app
          mv MornLiveUtil-signed.zip MornLiveUtil.app.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" MornLiveUtil.app.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" MornLiveUtil.app.zip --generate-notes
          fi

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SHA="$(shasum -a 256 MornLiveUtil.app.zip | awk '{print $1}')"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/TsukumiStudio/homebrew-tap.git" tap
          mkdir -p tap/Casks
          sed -e "s/@VERSION@/${VERSION}/g" -e "s/@SHA256@/${SHA}/g" Support/mornliveutil.rb.in > tap/Casks/mornliveutil.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/mornliveutil.rb
          git diff --cached --quiet || { git commit -m "mornliveutil ${VERSION}"; git push; }
